name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long native-calculation paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch for the existing advanced tests
        run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,campaign,advanced]'
      - name: Verify local Cu operando research tools
        run: python -m unittest discover -s projects/cu-np-operando/tests -v
      - name: Verify frozen Cu operando evidence
        run: python projects/cu-np-operando/scripts/evidence_gate.py verify
      - run: python -m pytest tests/ -v
      - run: python examples/mock_pipeline.py

name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,campaign]'
      - run: python -m pytest tests/ -v
      - run: python examples/mock_pipeline.py
      - name: Verify local Cu operando research tools
        run: python -m unittest discover -s projects/cu-np-operando/tests -v
      - name: Verify frozen Cu operando evidence
        run: python projects/cu-np-operando/scripts/evidence_gate.py verify

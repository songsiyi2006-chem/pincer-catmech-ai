[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pincer-catmech-ai"
version = "0.1.0"
description = "Auditable qRRHO thermochemistry and pincer steric descriptors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "ase>=3.22,<4", "pydantic>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
